version: '3'

vars:
  BINARY_NAME: poff
  EXE_EXT: '{{if eq OS "windows"}}.exe{{else}}{{end}}'
  BINARY: '{{.BINARY_NAME}}{{.EXE_EXT}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  LDFLAGS: -s -w -X port_finder/cmd.Version={{.VERSION}}
  INSTALL_DIR: '{{if eq OS "windows"}}{{.USERPROFILE}}\.local\bin{{else}}~/.local/bin{{end}}'

tasks:
  default:
    desc: Build the application
    cmds:
      - task: build

  build:
    desc: Build the poff binary
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -o {{.BINARY}} .

  clean:
    desc: Remove build artifacts
    cmds:
      - cmd: rm -f {{.BINARY}}
        platforms: [linux, darwin]
      - cmd: cmd /c "del {{.BINARY}} 2>NUL || exit 0"
        platforms: [windows]

  test:
    desc: Run unit tests
    cmds:
      - go test ./... -v

  install:
    desc: Install the binary to local bin directory
    deps: [build]
    cmds:
      - cmd: mkdir -p {{.INSTALL_DIR}} && cp {{.BINARY}} {{.INSTALL_DIR}}/{{.BINARY}}
        platforms: [linux, darwin]
      - cmd: cmd /c "if not exist \"{{.INSTALL_DIR}}\" mkdir \"{{.INSTALL_DIR}}\"" && cmd /c "copy /y {{.BINARY}} \"{{.INSTALL_DIR}}\{{.BINARY}}\""
        platforms: [windows]

  uninstall:
    desc: Uninstall the binary from local bin directory
    cmds:
      - cmd: rm -f {{.INSTALL_DIR}}/{{.BINARY}}
        platforms: [linux, darwin]
      - cmd: cmd /c "del /f /q \"{{.INSTALL_DIR}}\{{.BINARY}}\" 2>NUL || exit 0"
        platforms: [windows]
