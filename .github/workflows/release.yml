name: Release

# 버전 태그(v* ) 푸시 시 실행되어 ppm 배포 규약에 맞는 바이너리 아카이브와 체크섬을 빌드합니다.
# - 빌드 산출물: {bin_name}_{os}_{arch}.tar.gz|.zip (ppm 자동 탐색 명명 규칙)
# - 검증 산출물: 각 아카이브의 SHA-256 체크섬(.sha256)
# 참고: 자산 명명 규칙 및 무결성 검증에 대한 상세는 PACKAGE_GUIDE.md 참조.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: tar.gz
          - goos: linux
            goarch: arm64
            ext: tar.gz
          - goos: darwin
            goarch: amd64
            ext: tar.gz
          - goos: darwin
            goarch: arm64
            ext: tar.gz
          - goos: windows
            goarch: amd64
            ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package binary
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ github.ref_name }}"
          OS="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"
          EXT="${{ matrix.ext }}"
          BIN_NAME="poff"

          # 실행 파일 확장자 (Windows)
          EXE="${BIN_NAME}"
          if [ "$OS" = "windows" ]; then
            EXE="${BIN_NAME}.exe"
          fi

          # 스테이징 디렉토리에 바이너리 빌드
          STAGE="stage_${OS}_${ARCH}"
          mkdir -p "${STAGE}"
          GOOS="$OS" GOARCH="$ARCH" go build -trimpath -ldflags="-s -w -X port_finder/cmd.Version=${VERSION}" -o "${STAGE}/${EXE}" main.go

          # 아카이브 생성 (tar.gz / zip)
          ASSET="${BIN_NAME}_${OS}_${ARCH}.${EXT}"
          if [ "$EXT" = "zip" ]; then
            (cd "${STAGE}" && zip -r -9 "../${ASSET}" "${EXE}")
          else
            tar -C "${STAGE}" -czf "${ASSET}" "${EXE}"
          fi

          # SHA-256 체크섬 생성 (해시 + 파일명 형식)
          sha256sum "${ASSET}" > "${ASSET}.sha256"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          echo "ASSET_PATH=$(pwd)/${ASSET}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: asset-*
          merge-multiple: true

      - name: List assets
        run: ls -R ./dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
